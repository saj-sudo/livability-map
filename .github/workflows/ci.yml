name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (exact versions from uv.lock)
        run: uv sync --locked --extra dev --python 3.11
      - name: Lint
        run: uv run ruff check .
      - name: Tests (fixtures only, no data pulls per SPEC §11)
        run: uv run pytest
      - name: Pipeline on fixture world
        run: uv run python -m pipeline --fixtures --res 4 all

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # builds with the empty fallback manifest (no data pulls in CI, SPEC §11)
      - run: npm run build

  # SPEC §13.40: the built site on the fixture world, served with its _headers (CSP enforced),
  # driven in headless Chromium. The basemap host is blocked inside the tests.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Fixture build published to web/public/data
        run: |
          uv sync --locked --extra dev --python 3.11
          uv run python -m pipeline --fixtures --res 4 all
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build && node scripts/headers.mjs out
        working-directory: web
      - run: npm run e2e
        working-directory: web
