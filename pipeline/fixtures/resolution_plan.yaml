# Fixture-world resolution plan (SPEC §11.1): same shape and zooms as pipeline/resolution_plan.yaml,
# with XA (Alderland) standing in for the res-6 country list. XB is refined only around its
# urban clusters (Cedar, Dune); the desert stays at res 5.
resolutions:
  - {res: 4, fill: land, zooms: [2, 4], archive: hexes, slim_below_zoom: 3}
  - {res: 5, fill: land, zooms: [5, 7], archive: hexes}
  - res: 6
    fill: children
    parent: 5
    where: {countries: ['XA'], urban: cluster}
    zooms: [8, 9]
    archive: hexes_nbhd
  - res: 7
    fill: children
    parent: 6
    where: {urban: centre}
    zooms: [10, 13]
    archive: hexes_city
