name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check .
      - name: Tests (fixtures only, no data pulls per SPEC §11)
        run: uv run pytest
      - name: Pipeline on fixture world
        run: uv run python -m pipeline --fixtures --res 4 all

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # builds with the empty fallback manifest (no data pulls in CI, SPEC §11)
      - run: npm run build
