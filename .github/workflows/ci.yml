name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check .
      - name: Tests (fixtures only, no data pulls per SPEC §11)
        run: uv run pytest
      - name: Pipeline on fixture world
        run: uv run python -m pipeline --fixtures --res 4 all
