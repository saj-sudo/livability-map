# Dimension registry (SPEC §20.2). Everything a person can weight, including hazards and
# wellbeing so scoring and UI stay uniform. Joiners run in order; the first that yields a value
# sets {id}_raw and {id}_res. `domain` is the percentile domain (§20.4). `scale` is percentile
# (default) or minmax within source (§8.3). `label` is the short source tag carried on the hex.
# Score direction: every {id}_score is the plain percentile of the raw value; `higher_is` tells
# the client which direction is "good" (SPEC §13.25). Composition joiners map the five §6.1
# component keys (w/b/h/a/o) to source columns and are never scored (invariant 8).
# Field names refer to the columns produced by pipeline/prep/ for each source.

# ---- hazards (group hazard, higher is worse; computed by the hazards stage, not joiners) ----
- id: heat
  name: Extreme heat (days > 35C)
  group: hazard
  kind: score
  unit: "days/yr above 35 °C"
  decimals: 0
  higher_is: worse
  coverage: [global]
  sources: [cckp_hd35]
  note: "Days per year above 35 °C dry-bulb (CCKP hd35). Humidity is not counted, so humid places (Bangladesh, the US Gulf coast, West Africa, Southeast Asia) can look milder than their heat stress; the humid-heat layer (humid) covers humidity, so read the two together"
- id: humid
  name: Humid heat (heat index > 35 °C)
  group: hazard
  kind: score
  unit: "days/yr with heat index above 35 °C"
  decimals: 0
  higher_is: worse
  coverage: [global]
  sources: [cckp_hi35]
  note: "Days per year with a heat index above 35 °C (CCKP hi35). The heat index combines temperature and humidity, so this complements the dry-heat layer; both are hazards, so heat weighs twice in combined exposure (SPEC §13.47)"
- id: rflood
  name: Riverine flood (1-in-100)
  group: hazard
  kind: score
  unit: "% of area in a 1-in-100-year flood"
  multiply: 100
  decimals: 1
  higher_is: worse
  coverage: [global]
  sources: [aqueduct_floods_river]
- id: cflood
  name: Coastal flood (1-in-100)
  group: hazard
  kind: score
  unit: "% of area in a 1-in-100-year flood"
  multiply: 100
  decimals: 1
  higher_is: worse
  coverage: [global]
  sources: [aqueduct_floods_coast]
- id: wstress
  name: Water stress (2050)
  group: hazard
  kind: score
  unit: "water stress category (0-4)"
  decimals: 0
  higher_is: worse
  coverage: [global]
  sources: [aqueduct_water_stress]

# ---- wellbeing ------------------------------------------------------------------------------
- id: wb
  name: Wellbeing (Subnational HDI, national happiness fallback)
  group: wellbeing
  kind: score
  higher_is: better
  scale: minmax
  coverage: [global]
  sources: [gdl_shdi, gdl_shdi_regions, whr_ladder]
  joiners:
    - {source: gdl_shdi_regions, joiner: polygon_centroid, res: admin1, field: shdi, id_field: GDLCODE, domain: global, label: shdi, unit: "on the Subnational HDI (0-1)", decimals: 3}
    - {source: whr_ladder, joiner: iso_lookup, res: national, field: ladder, domain: global, label: whr, unit: "/ 10 life evaluation", decimals: 2}
  note: "min-max within source, never mixed (SPEC §8.3); SHDI 0-1, WHR life evaluation 0-10"

# ---- life dimensions (§20.6) ----------------------------------------------------------------
- id: jobs
  name: Early-career job market
  group: life
  kind: score
  higher_is: better
  coverage: [global, oecd, us, eu, uk, fr, ca, au]
  sources: [ca_statcan_da_profile, ca_statcan_da_boundaries, au_abs_sa2_gcp, au_abs_sa2_boundaries, acs_summary, cb_tracts, eurostat_census_grid_2021, eng_imd_2025, ons_lsoa_2021, fr_insee_iris_2021, fr_ign_iris_contours, oecd_regional_wellbeing, oecd_tl2_correspondence, ilostat_youth_unemp]
  joiners:
    - {source: acs_summary, joiner: area_weighted_overlay, res: tract, field: emp_rate_16_29, weight_field: pop_16_29, domain: us, label: acs, unit: "% employed (ages 16-29)", multiply: 100, decimals: 0}
    - {source: eurostat_census_grid_2021, joiner: point_mean, res: grid, field: emp_rate, weight_field: pop_1564, domain: eu, label: eugrid, unit: "% employed (ages 15-64)", multiply: 100, decimals: 0}
    - {source: eng_imd_2025, joiner: area_weighted_overlay, res: area, field: emp_dep_rate, weight_field: pop_working, domain: uk, label: imd, higher_is: worse, unit: "% of working-age people employment-deprived (IoD2025, higher = worse)", multiply: 100, decimals: 0}
    - {source: fr_insee_iris_2021, joiner: area_weighted_overlay, res: area, field: emp_rate, weight_field: pop_1564, domain: fr, label: rp, unit: "% employed (ages 15-64)", multiply: 100, decimals: 0}
    - {source: ca_statcan_da_profile, joiner: area_weighted_overlay, res: area, field: emp_rate, weight_field: pop_15plus, domain: ca, label: census, unit: "% employed (ages 15+)", decimals: 0}
    - {source: au_abs_sa2_gcp, joiner: area_weighted_overlay, res: area, field: emp_rate, weight_field: pop_15plus, domain: au, label: census, unit: "% of people 15+ employed", multiply: 100, decimals: 0}
    - {source: oecd_regional_wellbeing, joiner: polygon_centroid, res: admin1, field: jobs_score, domain: oecd, label: oecd, unit: "/ 10 (OECD jobs score)", decimals: 1}
    - {source: ilostat_youth_unemp, joiner: iso_lookup, res: national, field: youth_employment_rate, domain: global, label: ilostat, unit: "% of 15-24s employed", decimals: 0}
  note: "US: employment rate of civilians aged 16-29 (ACS B23001). OECD: Jobs well-being score 0-10 (TL2). Global: 100 - youth (15-24) unemployment rate (ILOSTAT). EU: employment rate of 15-64s on the Eurostat 1 km census grid. England: IoD 2025 employment deprivation (LSOA, reflected so higher = better). France: INSEE employment rate of 15-64s (IRIS). Canada and Australia: census employment rates (DA, SA2). Different constructs, labeled; all higher = better"

- id: transit
  name: Public transit access
  group: life
  kind: score
  higher_is: better
  coverage: [us]
  sources: [epa_sld]
  joiners:
    - {source: epa_sld, joiner: area_weighted_overlay, res: tract, field: D4C, weight_field: TotPop, domain: us, label: sld, unit: "transit trips/hour nearby", decimals: 1}
  note: "EPA SLD v3 D4C: transit trips per hour within 0.25 mi of the block group, evening peak; block groups are tagged tract (finest §6.1 tag). Global OSM/Mobility Database layer is v2 (ODbL share-alike)"

- id: school
  name: Schools
  group: life
  kind: score
  higher_is: better
  coverage: [us]
  sources: [urban_edu_districts, nces_district_boundaries]
  joiners:
    - {source: urban_edu_districts, joiner: area_weighted_overlay, res: county, field: grad_rate_midpt, weight_field: cohort_num, domain: us, label: edfacts, unit: "% graduate on time", decimals: 0}
  note: "EDFacts adjusted-cohort graduation rate (all students, 2019) by school district, tagged county (a district is closer to county than tract scale); attainment/outcome, not school quality. SEDA excluded (non-transferable)"

- id: lgbtq
  name: LGBTQ+ presence and acceptance (US couples, EU city survey)
  group: life
  kind: score
  higher_is: better
  coverage: [us, eucities]
  sources: [acs_summary, cb_tracts, eu_qol_cities, gisco_urau_cities]
  joiners:
    - {source: acs_summary, joiner: area_weighted_overlay, res: tract, field: ss_couples_per_1k, weight_field: households, domain: us, label: acs, unit: "same-sex couples per 1,000 households", decimals: 1}
    - {source: eu_qol_cities, joiner: polygon_centroid, res: city, field: gay_good_pct, domain: eucities, label: euqol, unit: "% of residents who say the city is a good place for gay or lesbian people", decimals: 0}
  note: "US: a presence proxy, same-sex spouses + same-sex unmarried partners (ACS B09019, SPEC §13.20) per 1,000 households, by tract. EU cities (about 83 cities in the EU, EFTA, UK, Western Balkans and Türkiye): a perception, the share of residents who strongly or somewhat agree their city is a good place for gay or lesbian people (2023 survey, one value for the whole city, SPEC §13.48). Different constructs, labeled and ranked separately; missing outside US tracts and surveyed cities. State policy tallies (MAP) added once permission is granted"

- id: pol
  name: Political lean
  group: life
  kind: signed
  unit: "two-party margin (D+ / R-)"
  decimals: 0
  coverage: [us]
  sources: [medsl_county_pres, cb_counties]
  joiners:
    - {source: medsl_county_pres, joiner: polygon_centroid, res: county, field: margin_2024, domain: us, label: medsl, unit: "two-party margin (D+ / R-)", decimals: 0}
  note: "-100 (all Republican) .. +100 (all Democratic) two-party margin, 2024 presidential; the person picks a preference"

- id: race
  name: Racial and ethnic composition
  group: life
  kind: composition
  unit: "% of residents"
  decimals: 0
  coverage: [us]
  sources: [acs_summary, cb_tracts]
  joiners:
    - {source: acs_summary, joiner: area_weighted_overlay, res: tract, fields: {w: pct_white, b: pct_black, h: pct_hisp, a: pct_asian, o: pct_other}, weight_field: pop_total, domain: us, label: acs, unit: "% of residents", decimals: 0}
  note: "shares from ACS B03002: non-Hispanic white, non-Hispanic Black, Hispanic or Latino (any race), non-Hispanic Asian + Pacific Islander, everyone else; never scored (invariant 8)"

- id: incmix
  name: Income mix
  group: life
  kind: score
  higher_is: better
  coverage: [global, us, fr, nl, ca]
  sources: [ca_statcan_da_profile, ca_statcan_da_boundaries, acs_summary, cb_tracts, fr_insee_iris_2021, fr_insee_filosofi_iris_2021, fr_ign_iris_contours, nl_cbs_vierkant_500m, wb_gsap, wb_gsap_regions]
  joiners:
    - {source: acs_summary, joiner: area_weighted_overlay, res: tract, field: income_entropy, weight_field: households, domain: us, label: acs, unit: "income mix (0-1)", decimals: 2}
    - {source: fr_insee_iris_2021, joiner: area_weighted_overlay, res: area, field: poverty_rate, weight_field: pop_1564, domain: fr, label: filosofi, higher_is: worse, unit: "% below the poverty line (60% of median)", decimals: 0}
    - {source: nl_cbs_vierkant_500m, joiner: point_mean, res: grid, field: low_income_share, weight_field: households, domain: nl, label: cbs, higher_is: worse, unit: "% low-income households (bottom 40%)", decimals: 0}
    - {source: ca_statcan_da_profile, joiner: area_weighted_overlay, res: area, field: low_income_rate, weight_field: population, domain: ca, label: limat, higher_is: worse, unit: "% in low income (LIM-AT)", decimals: 0}
    - {source: wb_gsap, joiner: polygon_centroid, res: admin1, field: nonpoor_share, domain: global, label: gsap, unit: "% above the $4.20/day line", multiply: 100, decimals: 0}
  note: "US: within-area income diversity (entropy of the 16 ACS B19001 brackets, 0-1). Global: share of people above the $4.20/day (2021 PPP) poverty line (GSAP 2023), a level not a mix. France (Filosofi poverty rate, IRIS), the Netherlands (CBS low-income households, 500 m) and Canada (LIM-AT, DA) are deprivation rates reflected so higher = better. Different constructs, labeled"

- id: house
  name: Housing cost burden
  group: life
  kind: score
  higher_is: worse
  coverage: [oecd, us, uk, ca, au]
  sources: [ca_statcan_da_profile, ca_statcan_da_boundaries, au_abs_sa2_gcp, au_abs_sa2_boundaries, acs_summary, cb_tracts, eng_imd_2025, ons_lsoa_2021, oecd_regional_wellbeing, oecd_tl2_correspondence]
  joiners:
    - {source: acs_summary, joiner: area_weighted_overlay, res: tract, field: rent_share_income, weight_field: renter_households, domain: us, label: acs, unit: "% of income on rent", decimals: 0}
    - {source: eng_imd_2025, joiner: area_weighted_overlay, res: area, field: housing_barriers, weight_field: population, domain: uk, label: imd, unit: "barriers to housing and services score (IoD2025, higher = worse)", decimals: 1}
    - {source: ca_statcan_da_profile, joiner: area_weighted_overlay, res: area, field: shelter_burden, weight_field: households, domain: ca, label: census, unit: "% of households spending 30%+ of income on shelter", multiply: 100, decimals: 0}
    - {source: au_abs_sa2_gcp, joiner: area_weighted_overlay, res: area, field: rent_share_income, weight_field: population, domain: au, label: census, unit: "% median rent / median household income", multiply: 100, decimals: 0}
    - {source: oecd_regional_wellbeing, joiner: polygon_centroid, res: admin1, field: housing_burden, domain: oecd, label: oecd, unit: "/ 10 (OECD, higher = worse)", decimals: 1}
  note: "US: median gross rent as % of household income (ACS B25071). OECD: 10 - Housing well-being score (rooms per person, affordability satisfaction), so higher = worse housing conditions. England: IoD 2025 barriers to housing and services (LSOA). Canada: households spending 30%+ of income on shelter (DA). Australia: median rent as a share of median household income (SA2). All higher = worse"

- id: health
  name: Healthcare access
  group: life
  kind: score
  higher_is: better
  coverage: [oecd, us, uk]
  sources: [hrsa_ahrf, cb_counties, acs_summary, eng_imd_2025, ons_lsoa_2021, oecd_regional_wellbeing, oecd_tl2_correspondence]
  joiners:
    - {source: hrsa_ahrf, joiner: polygon_centroid, res: county, field: physicians_per_10k, domain: us, label: hrsa, unit: "physicians per 10,000", decimals: 1}
    - {source: eng_imd_2025, joiner: area_weighted_overlay, res: area, field: health_dep, weight_field: population, domain: uk, label: imd, higher_is: worse, unit: "health deprivation score (IoD2025, higher = worse)", decimals: 2}
    - {source: oecd_regional_wellbeing, joiner: polygon_centroid, res: admin1, field: health_score, domain: oecd, label: oecd, unit: "/ 10 (OECD health score)", decimals: 1}
  note: "US: active non-federal MDs per 10,000 residents (HRSA AHRF, county population from ACS). OECD: Health well-being score 0-10 (life expectancy, mortality), an outcome not access. England: IoD 2025 health deprivation (LSOA, reflected so higher = better). Different constructs, labeled"

- id: cost
  name: Cost of living (price level)
  group: life
  kind: score
  higher_is: worse
  coverage: [global, us]
  sources: [bea_rpp_metro, bea_rpp_state, cb_cbsa, cb_states, wb_icp_pli, wb_gdp_pli]
  joiners:
    - {source: bea_rpp_metro, joiner: polygon_centroid, res: county, field: rpp_all, domain: us, label: bea, unit: "index (US = 100)", decimals: 0}
    - {source: bea_rpp_state, joiner: polygon_centroid, res: admin1, field: rpp_all, domain: us, label: bea, unit: "index (US = 100)", decimals: 0}
    - {source: wb_icp_pli, joiner: iso_lookup, res: national, field: pli_household, domain: global, label: icp, unit: "index (world = 100)", decimals: 0}
    - {source: wb_gdp_pli, joiner: iso_lookup, res: national, field: pli_gdp, domain: global, label: wdi, unit: "index (world = 100)", decimals: 0}
  note: "US: BEA regional price parity, all items (US = 100), metro area first (tagged county, the finest tag a CBSA fits) then state. Elsewhere: World Bank ICP 2021 household-consumption price level (World = 100); where ICP has no row, the WDI GDP price-level ratio rescaled onto the same world base through the countries both cover. Different bases, labeled"

- id: rent
  name: Housing cost (rent level)
  group: life
  kind: score
  higher_is: worse
  coverage: [us, de, nl, au]
  sources: [hud_fmr, cb_counties, de_zensus_2022, nl_cbs_vierkant_100m, au_abs_sa2_gcp, au_abs_sa2_boundaries]
  joiners:
    - {source: hud_fmr, joiner: polygon_centroid, res: county, field: fmr_2br, domain: us, label: hud, unit: "USD/month (2-bedroom FMR)", decimals: 0}
    - {source: de_zensus_2022, joiner: point_mean, res: grid, field: rent_eur_m2, weight_field: dwellings, domain: de, label: zensus, unit: "EUR/m² net cold rent", decimals: 2}
    - {source: nl_cbs_vierkant_100m, joiner: point_mean, res: grid, field: woz_keur, weight_field: homes, domain: nl, label: woz, unit: "thousand EUR average home value (WOZ)", decimals: 0}
    - {source: au_abs_sa2_gcp, joiner: area_weighted_overlay, res: area, field: median_rent_weekly, weight_field: population, domain: au, label: census, unit: "AUD/week median rent", decimals: 0}
  note: "HUD Fair Market Rent for a 2-bedroom unit, FY2026, USD per month, by county (the whole-county row or the median of New England town rows); Germany: Zensus 2022 average net cold rent per m² on the 100 m grid. Netherlands: CBS average WOZ home value (a price level, not a rent) on 100 m squares. Australia: ABS 2021 median weekly rent (SA2). Different constructs, labeled; all higher = more expensive"

# ---- hex-level extras (added 2026-09-22, SPEC §20.6): computed per hex from a global raster or
# point set, resolution tag `hex` (or `basin` for Aqueduct sub-basins). `env` is present-day
# environment; it is shown beside the 2050 hazards but never enters `exposure` / `coverage`
# (decision §13.28).
- id: care
  name: Travel time to healthcare
  group: life
  kind: score
  higher_is: worse
  coverage: [global]
  sources: [map_healthcare]
  joiners:
    - {source: map_healthcare, joiner: raster_mean, res: hex, field: value, domain: global, label: map, unit: "min to the nearest health facility", decimals: 0}
  note: "Minutes by motorized transport to the nearest healthcare facility (Weiss et al. 2020, Malaria Atlas Project, 1 km, 2019), mean over the hex"
- id: air
  name: Air quality (fine particulate matter)
  group: env
  kind: score
  higher_is: worse
  coverage: [global]
  sources: [acag_pm25]
  joiners:
    - {source: acag_pm25, joiner: raster_mean, res: hex, field: value, domain: global, label: acag, unit: "µg/m³ PM2.5 (WHO guideline 5)", decimals: 1}
  note: "Annual mean PM2.5 in micrograms per cubic metre, 2024 (satellite-derived, WashU ACAG SatPM2.5 V6.GL.03, 0.01 degree), mean over the hex; the WHO guideline is 5"
- id: trees
  name: Tree cover
  group: env
  kind: score
  higher_is: better
  coverage: [global]
  sources: [cgls_tree_cover]
  joiners:
    - {source: cgls_tree_cover, joiner: raster_mean, res: hex, field: value, domain: global, label: cgls, decimate: 10, unit: "% tree cover", decimals: 0}
  note: "Percent of the hex under tree cover (Copernicus Global Land Cover 100 m, 2019), block-averaged to 1 km then averaged over the hex; water and permanent ice are excluded, deserts are honest zeros"
- id: net
  name: Internet speed
  group: life
  kind: score
  higher_is: better
  coverage: [global]
  sources: [ookla_fixed, ookla_mobile]
  joiners:
    - {source: ookla_fixed, joiner: point_mean, res: hex, field: d_mbps, weight_field: tests, domain: global, label: fixed, unit: "Mbps download", decimals: 0}
    - {source: ookla_mobile, joiner: point_mean, res: hex, field: d_mbps, weight_field: tests, domain: global, label: mobile, unit: "Mbps download (mobile)", decimals: 0}
  note: "Average Speedtest download speed in Mbps, 2026 Q2, weighted by tests: fixed broadband where anyone tested it, mobile where only mobile tests exist (labeled); CC BY-NC-SA 4.0, so the net_* attributes carry that licence"
- id: fire
  name: Wildfire (burned area)
  group: env
  kind: score
  higher_is: worse
  coverage: [global]
  sources: [gfed5_ba]
  joiners:
    - {source: gfed5_ba, joiner: raster_mean, res: hex, field: value, domain: global, label: gfed5, sample: centroid, unit: "% of the area burns per year (2001-2020)", decimals: 2}
  note: "Percent of the area burned per year, mean of 2001-2020 (GFED5 burned area, 0.25 degree): observed, not a 2050 projection, sampled at the hex centroid because the grid is coarser than the hex; cropland burning is included"
- id: drought
  name: Drought risk
  group: env
  kind: score
  higher_is: worse
  coverage: [global]
  sources: [aqueduct_water_stress]
  joiners:
    - {source: aqueduct_water_stress, joiner: polygon_centroid, res: basin, field: drr_cat, domain: global, label: aqueduct, unit: "drought risk category (0-4)", decimals: 0}
  note: "WRI Aqueduct drought risk category 0 (low) to 4 (high) of the sub-basin under the hex centroid; baseline from Aqueduct 3.0 carried into 4.0, no future-scenario drought exists; a quarter of sub-basins have no data"

# ---- NGO hex layers (added 2026-09-23, SPEC §13.36): global or low- and middle-income coverage
- id: city
  name: Access to a city (travel time)
  group: life
  kind: score
  higher_is: worse
  coverage: [global]
  sources: [map_travel_cities]
  joiners:
    - {source: map_travel_cities, joiner: raster_mean, res: hex, field: value, domain: global, label: map, unit: "minutes to the nearest city of 50,000+ (2015)", decimals: 0}
  note: "Motorised travel time to the nearest city of 50,000 or more people in 2015 (Malaria Atlas Project, Weiss et al. 2018): a proxy for access to jobs, services and markets, not a measure of the job market itself"

- id: wealth
  name: Relative wealth (within the country)
  group: life
  kind: score
  higher_is: better
  coverage: [lmic]
  sources: [meta_rwi]
  joiners:
    - {source: meta_rwi, joiner: point_radius, res: hex, field: rwi, radius_km: 3, agg: mean, domain: country, domain_by_country: true, label: rwi, unit: "relative wealth index (0 = the country's average)", decimals: 2}
  note: "Meta Relative Wealth Index (2021) for 93 low- and middle-income countries: satellite- and connectivity-based estimates of household wealth relative to the rest of the same country, averaged within 3 km. Ranked within each country only, so a score says how a place compares with its own country, not with the world. CC BY-NC 4.0"

- id: conflict
  name: Armed conflict nearby
  group: life
  kind: score
  higher_is: worse
  coverage: [global]
  sources: [ucdp_ged]
  joiners:
    - {source: ucdp_ged, joiner: point_radius, res: hex, field: fatal_per_year, radius_km: 25, agg: sum, domain: global, label: ucdp, unit: "conflict deaths per year within 25 km (2016-2025)", decimals: 1}
  note: "Organised-violence deaths per year within 25 km, 2016-2025 (UCDP GED 26.1: state-based, non-state and one-sided violence; events located to within 25 km or to a district). 0 means no recorded event nearby, not a guarantee of safety"

- id: walkcare
  name: Walking time to healthcare
  group: life
  kind: score
  higher_is: worse
  coverage: [global]
  sources: [map_walking_healthcare]
  joiners:
    - {source: map_walking_healthcare, joiner: raster_mean, res: hex, field: value, domain: global, label: map, unit: "minutes on foot to the nearest hospital or clinic", decimals: 0}
  note: "Walking-only travel time to the nearest hospital or clinic (Malaria Atlas Project 2020), for people without motorised transport; the motorised time is the `care` dimension"

- id: water
  name: Working water points nearby
  group: life
  kind: score
  higher_is: better
  coverage: [wpdx]
  sources: [wpdx_water_points]
  joiners:
    - {source: wpdx_water_points, joiner: point_radius, res: hex, field: has_water, radius_km: 5, agg: mean, domain: global, label: wpdx, unit: "% of recorded water points within 5 km with water at the last visit", multiply: 100, decimals: 0}
  note: "Share of the community water points recorded within 5 km (WPdx+, 19 countries in Africa and South Asia) that had water when last visited. Missing where no point is recorded, which is common in cities with piped water: no point never means no water. CC BY-SA 4.0"

- id: nri
  name: Natural hazard losses today (US)
  group: env
  kind: score
  higher_is: worse
  coverage: [us]
  sources: [fema_nri, cb_tracts]
  joiners:
    - {source: fema_nri, joiner: area_weighted_overlay, res: tract, field: loss_per_1k, weight_field: population, domain: us, label: nri, unit: "USD lost per year per USD 1,000 of buildings (all 18 NRI hazards)", decimals: 2}
  note: "FEMA National Risk Index expected annual loss rate for buildings, present day, across all 18 hazards incl. hurricane, tornado, earthquake and landslide that the 2050 layers do not model. A rate per dollar of buildings, so large or wealthy tracts do not look riskier for having more to lose. Present-day environment: never part of the 2050 exposure score"

- id: phealth
  name: Adults in fair or poor health (US)
  group: life
  kind: score
  higher_is: worse
  coverage: [us]
  sources: [cdc_places, cb_tracts]
  joiners:
    - {source: cdc_places, joiner: area_weighted_overlay, res: tract, field: poor_health_pct, weight_field: population, domain: us, label: places, unit: "% of adults reporting fair or poor health", decimals: 1}
  note: "CDC PLACES model-based estimate (BRFSS) of adults who rate their health fair or poor: a health outcome beside `health`, which measures doctor supply. Model estimates, not a survey of each tract"

- id: industry
  name: Heavy industry nearby
  group: env
  kind: score
  higher_is: worse
  coverage: [global]
  sources: [climate_trace_assets, gem_trackers]
  joiners:
    - {source: climate_trace_assets, joiner: point_radius, res: hex, field: one, radius_km: 10, agg: sum, domain: global, label: ctrace, unit: "large industrial facilities within 10 km", decimals: 0}
  note: "Large industrial facilities within 10 km (Climate TRACE assets: power plants, refineries, coal mines, steel, cement, chemicals, aluminium, pulp and paper, landfills), counted, not weighted by CO2e, because tons of greenhouse gas measure climate impact rather than local harm. Climate TRACE models large emitters, so small plants and some countries are under-represented: 0 means none recorded nearby, not none. Global Energy Monitor's coal, gas, steel and cement plants are added where Climate TRACE has no asset within 2 km. On the coarsest, zoomed-out hexagons the radius is the hexagon size (about 23 km), never smaller. Present-day environment: never part of the 2050 exposure score"

- id: no2
  name: Traffic and combustion pollution (NO2)
  group: env
  kind: score
  higher_is: worse
  coverage: [global]
  sources: [s5p_no2]
  joiners:
    - {source: s5p_no2, joiner: raster_mean, res: hex, field: value, sample: auto, domain: global, label: s5p, unit: "µmol/m² NO2 in the air column (2023 mean)", multiply: 1000000, decimals: 0}
  note: "Nitrogen dioxide over the place (Sentinel-5P TROPOMI tropospheric column, 2023 mean, about 5 km pixels): a tracer of road traffic, power plants and industry, finer-grained inside cities than PM2.5. A column above the ground, not the concentration at street level, so it ranks places rather than measuring what a person breathes. Present-day environment: never part of the 2050 exposure score"

- id: amen
  name: Everyday amenities nearby
  group: life
  kind: score
  higher_is: better
  coverage: [global]
  sources: [overture_places]
  joiners:
    - {source: overture_places, joiner: point_radius, res: hex, field: one, radius_km: 1, agg: sum, per_km2: true, domain: global, label: overture, unit: "everyday amenities per km² (groceries, pharmacies, clinics, schools, parks)", decimals: 2}
  note: "Groceries, pharmacies, clinics, schools, parks, playgrounds and libraries per km² within 1 km of the place (Overture Maps places). The radius is never smaller than the hexagon, so zoomed out it is a density over the whole hexagon. Overture's coverage is uneven between countries and follows how well places are mapped, so 0 means none recorded, not none"

# ---- EU cities perception survey and the Opportunity Atlas (added 2026-11-14, SPEC §13.48) ----
- id: immig
  name: Welcoming to immigrants (EU cities)
  group: life
  kind: score
  higher_is: better
  coverage: [eucities]
  sources: [eu_qol_cities, gisco_urau_cities]
  joiners:
    - {source: eu_qol_cities, joiner: polygon_centroid, res: city, field: immig_good_pct, domain: eucities, label: euqol, unit: "% of residents who say the city is a good place for immigrants from other countries", decimals: 0}
  note: "Share of residents who strongly or somewhat agree their city is a good place to live for immigrants from other countries (Perception of quality of life in European cities, 2023 survey, about 83 cities). What residents think, not what immigrants experience; one value for the whole city, missing outside surveyed cities"

- id: safe
  name: Feeling safe at night (EU cities)
  group: life
  kind: score
  higher_is: better
  coverage: [eucities]
  sources: [eu_qol_cities, gisco_urau_cities]
  joiners:
    - {source: eu_qol_cities, joiner: polygon_centroid, res: city, field: safe_night_pct, domain: eucities, label: euqol, unit: "% of residents who feel safe walking alone at night in the city", decimals: 0}
  note: "Share of residents who strongly or somewhat agree that they feel safe walking alone at night in their city (Perception of quality of life in European cities, 2023 survey, about 83 cities). A perception, not a crime rate; one value for the whole city, missing outside surveyed cities"

- id: opp
  name: Kids' adult income, all families (US)
  group: life
  kind: score
  higher_is: better
  coverage: [us]
  sources: [opp_atlas, census_tract_rel_2020_2010, cb_tracts]
  joiners:
    - {source: opp_atlas, joiner: area_weighted_overlay, res: tract, field: kfr_pooled, weight_field: children, domain: us, label: atlas, unit: "income percentile in adulthood of children who grew up here (0-100)", multiply: 100, decimals: 0}
  note: "Opportunity Atlas (Opportunity Insights): mean household income rank in adulthood (national percentile within the birth cohort) of children who grew up in the tract, children born 1978-1983, adult incomes around 2014-2015, all races and genders. Pooled over all parent incomes, so it partly reflects where well-off families already live, not only upward mobility. Published on 2010 tracts; carried to 2020 tracts by land area through the Census tract relationship file"

- id: opp25
  name: "Upward mobility: kids from low-income families (US)"
  group: life
  kind: score
  higher_is: better
  coverage: [us]
  sources: [opp_atlas, census_tract_rel_2020_2010, cb_tracts]
  joiners:
    - {source: opp_atlas, joiner: area_weighted_overlay, res: tract, field: kfr_p25, weight_field: children, domain: us, label: atlas, unit: "mean adult income rank (0-100) of kids whose parents were at the 25th percentile", multiply: 100, decimals: 0}
  note: "The standard upward-mobility measure: how children from low-income families in this tract did as adults (Opportunity Atlas, Opportunity Insights: predicted household income rank in adulthood of children whose parents were at the 25th income percentile, all races and genders). Children born 1978-1983, adult incomes around 2014-2015. Published on 2010 tracts; carried to 2020 tracts by land area through the Census tract relationship file"
