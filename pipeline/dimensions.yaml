# Dimension registry (SPEC §20.2). Everything a person can weight, including hazards and
# wellbeing so scoring and UI stay uniform. Joiners run in order; the first that yields a value
# sets {id}_raw and {id}_res. `domain` is the percentile domain (§20.4). `scale` is percentile
# (default) or minmax within source (§8.3). `label` is the short source tag carried on the hex.
# Score direction: every {id}_score is the plain percentile of the raw value; `higher_is` tells
# the client which direction is "good" (SPEC §13.25). Composition joiners map the five §6.1
# component keys (w/b/h/a/o) to source columns and are never scored (invariant 8).
# Field names refer to the columns produced by pipeline/prep/ for each source.

# ---- hazards (group hazard, higher is worse; computed by the hazards stage, not joiners) ----
- id: heat
  name: Extreme heat (days > 35C)
  group: hazard
  kind: score
  higher_is: worse
  coverage: [global]
  sources: [cckp_hd35]
- id: rflood
  name: Riverine flood (1-in-100)
  group: hazard
  kind: score
  higher_is: worse
  coverage: [global]
  sources: [aqueduct_floods_river]
- id: cflood
  name: Coastal flood (1-in-100)
  group: hazard
  kind: score
  higher_is: worse
  coverage: [global]
  sources: [aqueduct_floods_coast]
- id: wstress
  name: Water stress (2050)
  group: hazard
  kind: score
  higher_is: worse
  coverage: [global]
  sources: [aqueduct_water_stress]

# ---- wellbeing ------------------------------------------------------------------------------
- id: wb
  name: Wellbeing (Subnational HDI, national happiness fallback)
  group: wellbeing
  kind: score
  higher_is: better
  scale: minmax
  coverage: [global]
  sources: [gdl_shdi, gdl_shdi_regions, whr_ladder]
  joiners:
    - {source: gdl_shdi_regions, joiner: polygon_centroid, res: admin1, field: shdi, id_field: GDLCODE, domain: global, label: shdi}
    - {source: whr_ladder, joiner: iso_lookup, res: national, field: ladder, domain: global, label: whr}
  note: "min-max within source, never mixed (SPEC §8.3); SHDI 0-1, WHR life evaluation 0-10"

# ---- life dimensions (§20.6) ----------------------------------------------------------------
- id: jobs
  name: Early-career job market
  group: life
  kind: score
  higher_is: better
  coverage: [global, oecd, us]
  sources: [acs_summary, cb_tracts, oecd_regional_wellbeing, oecd_tl2_correspondence, ilostat_youth_unemp]
  joiners:
    - {source: acs_summary, joiner: area_weighted_overlay, res: tract, field: emp_rate_16_29, weight_field: pop_16_29, domain: us, label: acs}
    - {source: oecd_regional_wellbeing, joiner: polygon_centroid, res: admin1, field: jobs_score, domain: oecd, label: oecd}
    - {source: ilostat_youth_unemp, joiner: iso_lookup, res: national, field: youth_employment_rate, domain: global, label: ilostat}
  note: "US: employment rate of civilians aged 16-29 (ACS B23001). OECD: Jobs well-being score 0-10 (TL2). Global: 100 - youth (15-24) unemployment rate (ILOSTAT). Different constructs, labeled; all higher = better"

- id: transit
  name: Public transit access
  group: life
  kind: score
  higher_is: better
  coverage: [us]
  sources: [epa_sld]
  joiners:
    - {source: epa_sld, joiner: area_weighted_overlay, res: tract, field: D4C, weight_field: TotPop, domain: us, label: sld}
  note: "EPA SLD v3 D4C: transit trips per hour within 0.25 mi of the block group, evening peak; block groups are tagged tract (finest §6.1 tag). Global OSM/Mobility Database layer is v2 (ODbL share-alike)"

- id: school
  name: Schools
  group: life
  kind: score
  higher_is: better
  coverage: [us]
  sources: [urban_edu_districts, nces_district_boundaries]
  joiners:
    - {source: urban_edu_districts, joiner: area_weighted_overlay, res: county, field: grad_rate_midpt, weight_field: cohort_num, domain: us, label: edfacts}
  note: "EDFacts adjusted-cohort graduation rate (all students, 2019) by school district, tagged county (a district is closer to county than tract scale); attainment/outcome, not school quality. SEDA excluded (non-transferable)"

- id: lgbtq
  name: LGBTQ+ presence (same-sex couple households)
  group: life
  kind: score
  higher_is: better
  coverage: [us]
  sources: [acs_summary, cb_tracts]
  joiners:
    - {source: acs_summary, joiner: area_weighted_overlay, res: tract, field: ss_couples_per_1k, weight_field: households, domain: us, label: acs}
  note: "proxy: same-sex spouses + same-sex unmarried partners (ACS B09019, SPEC §13.20) per 1,000 households; state policy tallies (MAP) added once permission is granted"

- id: pol
  name: Political lean
  group: life
  kind: signed
  coverage: [us]
  sources: [medsl_county_pres, cb_counties]
  joiners:
    - {source: medsl_county_pres, joiner: polygon_centroid, res: county, field: margin_2024, domain: us, label: medsl}
  note: "-100 (all Republican) .. +100 (all Democratic) two-party margin, 2024 presidential; the person picks a preference"

- id: race
  name: Racial and ethnic composition
  group: life
  kind: composition
  coverage: [us]
  sources: [acs_summary, cb_tracts]
  joiners:
    - {source: acs_summary, joiner: area_weighted_overlay, res: tract, fields: {w: pct_white, b: pct_black, h: pct_hisp, a: pct_asian, o: pct_other}, weight_field: pop_total, domain: us, label: acs}
  note: "shares from ACS B03002: non-Hispanic white, non-Hispanic Black, Hispanic or Latino (any race), non-Hispanic Asian + Pacific Islander, everyone else; never scored (invariant 8)"

- id: incmix
  name: Income mix
  group: life
  kind: score
  higher_is: better
  coverage: [global, us]
  sources: [acs_summary, cb_tracts, wb_gsap, wb_gsap_regions]
  joiners:
    - {source: acs_summary, joiner: area_weighted_overlay, res: tract, field: income_entropy, weight_field: households, domain: us, label: acs}
    - {source: wb_gsap, joiner: polygon_centroid, res: admin1, field: nonpoor_share, domain: global, label: gsap}
  note: "US: within-area income diversity (entropy of the 16 ACS B19001 brackets, 0-1). Global: share of people above the $4.20/day (2021 PPP) poverty line (GSAP 2023), a level not a mix. Different constructs, labeled"

- id: house
  name: Housing cost burden
  group: life
  kind: score
  higher_is: worse
  coverage: [oecd, us]
  sources: [acs_summary, cb_tracts, oecd_regional_wellbeing, oecd_tl2_correspondence]
  joiners:
    - {source: acs_summary, joiner: area_weighted_overlay, res: tract, field: rent_share_income, weight_field: renter_households, domain: us, label: acs}
    - {source: oecd_regional_wellbeing, joiner: polygon_centroid, res: admin1, field: housing_burden, domain: oecd, label: oecd}
  note: "US: median gross rent as % of household income (ACS B25071). OECD: 10 - Housing well-being score (rooms per person, affordability satisfaction), so higher = worse housing conditions"

- id: health
  name: Healthcare access
  group: life
  kind: score
  higher_is: better
  coverage: [oecd, us]
  sources: [hrsa_ahrf, cb_counties, acs_summary, oecd_regional_wellbeing, oecd_tl2_correspondence]
  joiners:
    - {source: hrsa_ahrf, joiner: polygon_centroid, res: county, field: physicians_per_10k, domain: us, label: hrsa}
    - {source: oecd_regional_wellbeing, joiner: polygon_centroid, res: admin1, field: health_score, domain: oecd, label: oecd}
  note: "US: active non-federal MDs per 10,000 residents (HRSA AHRF, county population from ACS). OECD: Health well-being score 0-10 (life expectancy, mortality), an outcome not access. Different constructs, labeled"

- id: cost
  name: Cost of living (price level)
  group: life
  kind: score
  higher_is: worse
  coverage: [global, us]
  sources: [bea_rpp_metro, bea_rpp_state, cb_cbsa, cb_states, wb_icp_pli, wb_gdp_pli]
  joiners:
    - {source: bea_rpp_metro, joiner: polygon_centroid, res: county, field: rpp_all, domain: us, label: bea}
    - {source: bea_rpp_state, joiner: polygon_centroid, res: admin1, field: rpp_all, domain: us, label: bea}
    - {source: wb_icp_pli, joiner: iso_lookup, res: national, field: pli_household, domain: global, label: icp}
    - {source: wb_gdp_pli, joiner: iso_lookup, res: national, field: pli_gdp, domain: global, label: wdi}
  note: "US: BEA regional price parity, all items (US = 100), metro area first (tagged county, the finest tag a CBSA fits) then state. Elsewhere: World Bank ICP 2021 household-consumption price level (World = 100); where ICP has no row, the WDI GDP price-level ratio rescaled onto the same world base through the countries both cover. Different bases, labeled"

- id: rent
  name: Housing cost (rent level)
  group: life
  kind: score
  higher_is: worse
  coverage: [us]
  sources: [hud_fmr, cb_counties]
  joiners:
    - {source: hud_fmr, joiner: polygon_centroid, res: county, field: fmr_2br, domain: us, label: hud}
  note: "HUD Fair Market Rent for a 2-bedroom unit, FY2026, USD per month, by county (the whole-county row or the median of New England town rows); the OECD/EU rent level is v2"
