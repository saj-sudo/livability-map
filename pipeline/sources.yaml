# One entry per dataset (SPEC §6.2, §7, §20.6). The fetch stage refuses any source whose
# license or (for direct sources) url is still VERIFY. `verified` records how the license and
# URL were checked: confirmed (first-hand, SPEC §15), search (search results / registry probes),
# none. Publish (Session 5) refuses sources that are not `confirmed`.
#
# access: direct    = fetch downloads url (or url + filename when url ends with /)
#         manual    = fetch checks the files are present and prints the recipe
#         dataverse = Harvard Dataverse guestbook flow (SPEC §13.26); manual when .env is empty
#         fixture   = synthetic data (only in pipeline/fixtures/sources.yaml)
#
# Extra keys read by pipeline/rawfiles.py and pipeline/prep/: `member` (file inside a zip),
# `gdb_member` (File Geodatabase directory inside a zip), `layer`, `geometry` (id of the source
# that supplies polygons for a tabular source), `sheet`, `header_row`.
# All URLs below were checked first-hand on 2026-09-22 (SPEC §15).

